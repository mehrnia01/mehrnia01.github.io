<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فرادید پردیس کاوش | راهکارهای نوآورانه</title>

    <meta name="description"
          content="شرکت فرادید پردیس کاوش - توسعه راهکارهای نوآورانه و تجهیزات پزشکی">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #020817;
            color: white;
            line-height: 1.8;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background:
                radial-gradient(circle at top right, #12315d 0%, transparent 35%),
                radial-gradient(circle at bottom left, #10284a 0%, transparent 30%),
                #020817;
        }

        .hero-content {
            max-width: 900px;
        }

        .logo {
            font-size: 54px;
            font-weight: bold;
            letter-spacing: 8px;
            margin-bottom: 25px;
        }

        .subtitle {
            font-size: 20px;
            color: #bfc9d8;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .description {
            max-width: 700px;
            margin: auto;
            color: #c7d0dc;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 14px 32px;
            border: 1px solid #8da4c2;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #dfe8f3;
            color: #020817;
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #7f8da0;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 38px;
            }

            h1 {
                font-size: 34px;
            }

            .description {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<section class="hero">

    <div class="hero-content">

        <div class="logo">
            FARADID
        </div>

        <div class="subtitle">
            فرادید پردیس کاوش
        </div>

        <h1>
            راهکارهای نوآورانه
        </h1>

        <p class="description">
            توسعه فناوری، طراحی محصولات نوآورانه و ارائه راهکارهای
            پیشرفته در حوزه تجهیزات پزشکی و فناوری.
        </p>

        <a href="#" class="button">
            محصولات ما
        </a>

    </div>

</section>

<footer>
    © 2026 Faradid Pardis Kavosh
</footer>

</body>
</html>
